<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This roadmap is empty — Kurultai</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f4f0">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light;
  --paper:#f6f4f0;
  --panel:#ffffff;
  --ink:#161411;
  --mute:#5c574e;
  --line:#e4dfd6;
  --gold:#8f6d1f;
  --gold-line:#d4c4a0;
  --font-d:ui-sans-serif,"Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-d);
  font-size:1.0625rem;
  line-height:1.6;
  min-height:100svh;
  display:grid;
  place-content:center;
  text-align:center;
  padding:2rem;
}
p{color:var(--mute)}
a{
  color:var(--gold);
  text-decoration:none;
  font-family:var(--font-m);
  font-size:max(12px,.75rem);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:1.5rem;
  display:inline-block;
}
a:hover{text-decoration:underline;text-underline-offset:.22em}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div>
<p>This roadmap is empty</p>
<p><a href="/">Return to the roadmaps</a></p>
</div>
</body>
</html>
